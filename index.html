<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помічник для Кобзи</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1b;
    --muted: #787c7e;
    --line: #d3d6da;
    --black: #787c7e;
    --yellow: #c9b458;
    --green: #6aaa64;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121213; --fg: #ffffff; --muted: #818384; --line: #3a3a3c; --black: #3a3a3c; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
  .sub { color: var(--muted); font-size: .875rem; margin: -12px 0 0; text-align: center; max-width: 34ch; line-height: 1.4; }
  .row { display: flex; gap: 6px; }
  .tile {
    width: 58px; height: 58px; border: 2px solid var(--line);
    display: grid; place-items: center;
    font-size: 1.75rem; font-weight: 700; text-transform: uppercase;
    background: transparent; color: var(--fg);
    user-select: none; padding: 0;
  }
  .row.current .tile { cursor: pointer; }
  .tile.black  { background: var(--black);  border-color: var(--black);  color: #fff; }
  .tile.yellow { background: var(--yellow); border-color: var(--yellow); color: #fff; }
  .tile.green  { background: var(--green);  border-color: var(--green);  color: #fff; }
  .history { display: flex; flex-direction: column; gap: 6px; }
  button.submit {
    font: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 14px 28px; border: 0; border-radius: 4px;
    background: var(--green); color: #fff; cursor: pointer;
  }
  button.submit:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .status { color: var(--muted); font-size: .9375rem; text-align: center; min-height: 1.4em; }
  .status strong { color: var(--fg); }
  footer { color: var(--muted); font-size: .75rem; text-align: center; max-width: 40ch; line-height: 1.5; margin-top: 12px; }
  footer a { color: inherit; }
</style>
</head>
<body>

<h1>Помічник для Кобзи</h1>
<p class="sub">Зіграйте запропоноване слово в Кобзі, тоді натисніть на клітинки, щоб позначити кольори.</p>

<div class="history" id="history"></div>
<div class="row current" id="current"></div>

<button class="submit" id="submit">Далі</button>
<div class="status" id="status"></div>

<footer>
  Словник — <a href="https://github.com/kobzaapp/kobzadict">kobzadict</a>, згенерований із
  <a href="https://github.com/brown-uk/dict_uk">ВЕСУМ</a>, ліцензія
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC&nbsp;BY-NC-SA&nbsp;4.0</a>.
  Гра <a href="https://kobzaapp.github.io/">Кобза</a> © Kobza Development Team.
</footer>

<script src="words.js"></script>
<script src="solver.js"></script>
<script>
const CYCLE = ['black', 'yellow', 'green']

let candidates = cleanDictionary(window.VALID_WORDS)
let guess = recommend(candidates)
let colors = new Array(5).fill('black')

const historyEl = document.getElementById('history')
const currentEl = document.getElementById('current')
const statusEl = document.getElementById('status')
const submitEl = document.getElementById('submit')

function drawCurrent() {
  currentEl.innerHTML = ''
  if (guess === null) return
  ;[...guess].forEach((ch, i) => {
    const tile = document.createElement('button')
    tile.className = 'tile ' + colors[i]
    tile.textContent = ch
    tile.onclick = () => {
      colors[i] = CYCLE[(CYCLE.indexOf(colors[i]) + 1) % CYCLE.length]
      drawCurrent()
    }
    currentEl.appendChild(tile)
  })
}

function addHistoryRow(word, cols) {
  const row = document.createElement('div')
  row.className = 'row'
  ;[...word].forEach((ch, i) => {
    const tile = document.createElement('div')
    tile.className = 'tile ' + cols[i]
    tile.textContent = ch
    row.appendChild(tile)
  })
  historyEl.appendChild(row)
}

function setStatus() {
  if (guess === null) {
    statusEl.textContent = 'Немає слів, що відповідають цим кольорам.'
    submitEl.disabled = true
  } else {
    statusEl.innerHTML = `Залишилось варіантів: <strong>${candidates.length}</strong>`
    submitEl.disabled = false
  }
}

submitEl.onclick = () => {
  if (guess === null) return

  if (colors.every(c => c === 'green')) {
    addHistoryRow(guess, colors)
    currentEl.innerHTML = ''
    statusEl.innerHTML = `<strong>Розгадано — ${guess}</strong>`
    submitEl.disabled = true
    return
  }

  addHistoryRow(guess, colors)
  candidates = filterCandidates(candidates, guess, colors)
  guess = recommend(candidates)
  colors = new Array(5).fill('black')
  drawCurrent()
  setStatus()
}

drawCurrent()
setStatus()
</script>

</body>
</html>
